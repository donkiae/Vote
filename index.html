:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--muted:#6b7280;--accent:#3b5bdb;--bar:#e5e7eb;--border:#e2e5ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--text:#eceef2;--muted:#9aa1ad;--accent:#7c93ff;--bar:#2c3038;--border:#2c3038}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--text:#eceef2;--muted:#9aa1ad;--accent:#7c93ff;--bar:#2c3038;--border:#2c3038}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 16px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.logo{aspect-ratio:1;border-radius:10px;background:#f7f3e8;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-weight:600}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.count{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
button{font:inherit;font-weight:600;padding:10px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.note{margin-top:20px;color:var(--muted);text-align:center;font-size:.9rem}

let state;
try{state=JSON.parse(document.getElementById('state').textContent)}catch(e){state={votes:[0,0,0]}}
let artifact=null,voted=null,busy=false,msg='';
try{const v=localStorage.getItem('voted-logo');if(v!==null)voted=Number(v)}catch(e){}

function buildDoc(s){
  const css=document.getElementById('css').textContent;
  const app=document.getElementById('app').textContent;
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Vote for our logo</title><style id="css">'+css+'</style></head><body><main><h1>Vote for our logo</h1><p class="sub">Pick your favourite. One vote per person.</p><div class="grid" id="grid"></div><p class="note" id="note"></p></main><script id="state" type="application/json">'+JSON.stringify(s)+'<\/script><script id="app">'+app+'<\/script></body></html>';
}

function render(){
  const total=state.votes.reduce((a,b)=>a+b,0);
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  names.forEach((n,i)=>{
    const v=state.votes[i]||0,pct=total?Math.round(v/total*100):0;
    const c=document.createElement('div');
    c.className='card'+(voted===i?' mine':'');
    c.innerHTML='<div class="logo">'+art[i]+'</div><div class="name">'+n+'</div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="count"><span>'+v+' vote'+(v===1?'':'s')+'</span><span>'+pct+'%</span></div>';
    const b=document.createElement('button');
    b.textContent=voted===i?'Your vote':'Vote for '+n;
    b.disabled=voted!==null||!artifact||busy;
    b.onclick=()=>vote(i);
    c.appendChild(b);
    grid.appendChild(c);
  });
  document.getElementById('note').textContent=msg||('Total votes: '+total+(artifact||voted!==null?'':' · Voting isn\u2019t available in this view.'));
}

async function vote(i){
  if(voted!==null||!artifact||busy)return;
  busy=true;msg='';render();
  const next={votes:state.votes.map((v,k)=>k===i?v+1:v)};
  try{localStorage.setItem('voted-logo',String(i))}catch(e){}
  try{await artifact.publish(buildDoc(next))}
  catch(e){
    try{localStorage.removeItem('voted-logo')}catch(_){}
    busy=false;
    msg=(e&&e.code==='conflict')?'':'Couldn\u2019t record your vote. Please try again.';
    render();
  }
}

render();
if(window.claude&&claude.use){claude.use('artifact').then(a=>{artifact=a;render()}).catch(()=>{})}
